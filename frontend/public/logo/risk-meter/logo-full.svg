<svg width="200" height="32" viewBox="0 0 200 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Risk Meter -->
  <g transform="translate(0, 4)">
    <!-- Outer Circle -->
    <circle cx="12" cy="12" r="10" fill="none" stroke="#00bcd4" stroke-width="2"/>
    <!-- Risk Gradient Arc -->
    <path d="M 2 12 A 10 10 0 1 1 22 12" fill="none" stroke="url(#riskGradient)" stroke-width="2" stroke-linecap="round"/>
    <!-- Tick Marks -->
    <line x1="12" y1="2" x2="12" y2="4" stroke="#d4d4d4" stroke-width="1"/>
    <line x1="22" y1="12" x2="20" y2="12" stroke="#d4d4d4" stroke-width="1"/>
    <line x1="2" y1="12" x2="4" y2="12" stroke="#d4d4d4" stroke-width="1"/>
    <!-- Needle (pointing to safe) -->
    <line x1="12" y1="12" x2="12" y2="5" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="1.5" fill="white"/>
    <!-- Document Grid Background -->
    <pattern id="grid" width="2" height="2" patternUnits="userSpaceOnUse">
      <path d="M 2 0 L 0 0 0 2" fill="none" stroke="#e0e0e0" stroke-width="0.2" opacity="0.3"/>
    </pattern>
    <rect x="4" y="4" width="16" height="16" fill="url(#grid)" opacity="0.3"/>
  </g>
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="riskGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00bcd4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cca700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e00000;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Text -->
  <text x="28" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#d4d4d4">JasperRiskDetect</text>
  <text x="28" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#808080">iReport 3.7.1</text>
</svg>
